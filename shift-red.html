<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b93838">
<title>shift-red · A parsing playground</title>
<style>
  :root { color-scheme: light; --paper:#faf8f4; --ink:#292b32; --muted:#77766f; --line:#e3dfd7; --red:#b93838; --red-wash:#fcf0ed; --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { max-width:1180px; padding:54px 32px 40px; margin:auto; }
  header { display:flex; justify-content:space-between; align-items:center; gap:24px; margin-bottom:28px; }
  h1 { font-size:36px; letter-spacing:-1.6px; line-height:1; margin:0 0 12px; font-weight:750; }
  h1 span { color:var(--red); }
  header p { color:var(--muted); margin:0; }
  .badge { border:1px solid var(--line); border-radius:30px; padding:8px 13px; font:11px var(--mono); letter-spacing:1px; white-space:nowrap; }
  .game { background:white; border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:0 8px 30px #292b3205; }
  .panels { display:grid; grid-template-columns:minmax(230px, 34%) minmax(0,1fr); }
  .rule-panel { border-right:1px solid var(--line); min-width:0; }
  .panel-head { height:46px; display:grid; align-items:center; background:#f5f3ee; border-bottom:1px solid var(--line); font-size:10px; font-weight:700; letter-spacing:1.6px; color:var(--muted); }
  .rule-head { grid-template-columns:74px 1fr; }
  .state-head { grid-template-columns:1fr 86px; }
  .panel-head span { padding:0 18px; }
  .panel-head span:last-child { border-left:1px solid var(--line); }
  .scroll { height:344px; overflow:auto; scrollbar-width:thin; padding:12px 0; }
  .rule-row { display:grid; grid-template-columns:74px 1fr; min-height:38px; align-items:stretch; width:max-content; min-width:100%; font:15px/38px var(--mono); }
  .rule-label { color:var(--red); padding:0 18px; border-right:1px solid #efede7; overflow-wrap:anywhere; line-height:38px; }
  .rule-text { padding:0 18px; white-space:pre; }
  .rule-row.unavailable .rule-label,.rule-row.unavailable .rule-text { color:#b4b0aa; }
  .trace { width:max-content; min-width:100%; }
  .state-row { display:grid; grid-template-columns:minmax(0,1fr) 85px; min-height:38px; font:15px/38px var(--mono); }
  .state-content { display:flex; padding:0 18px 0 10px; white-space:pre; }
  .pointer { width:24px; flex-shrink:0; color:var(--red); font-size:12px; }
  .stack { min-width:160px; text-align:right; padding-right:12px; }
  .dot { color:var(--red); padding-right:12px; }
  .remaining { padding-right:20px; }
  .action { padding:0 18px; text-align:center; border-left:1px solid #efede7; white-space:pre; }
  .current { background:var(--red-wash); }
  .future { opacity:.32; }
  .error-text { color:var(--red); font-weight:700; }
  .input-area { border-top:1px solid var(--line); padding:18px 22px 20px; }
  .input-caption { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:10px; }
  label,.caption { font-size:10px; font-weight:700; letter-spacing:1.5px; color:var(--muted); }
  .status { color:var(--muted); font-size:12px; text-align:right; }
  .status.accepted { color:#29744e; }
  input,textarea,button { font:inherit; }
  input,textarea { border:1px solid var(--line); border-radius:9px; background:white; color:var(--ink); outline:none; }
  input:focus,textarea:focus { border-color:var(--red); box-shadow:0 0 0 3px #b9383810; }
  #user-input { width:100%; padding:12px 14px; font:19px/1.5 var(--mono); background:#fdfcf9; }
  input::placeholder { color:#aaa69e; }
  .help { display:flex; gap:22px; flex-wrap:wrap; margin:13px 2px 30px; color:var(--muted); font-size:12px; }
  kbd { font:12px var(--mono); border:1px solid var(--line); background:white; border-radius:4px; padding:1px 5px; color:var(--ink); }
  .setup { display:grid; grid-template-columns:100px minmax(0,1fr); gap:16px 18px; align-items:start; }
  button { cursor:pointer; border:1px solid var(--line); border-radius:9px; background:white; color:var(--ink); font-size:11px; font-weight:700; letter-spacing:1px; padding:13px 16px; min-height:44px; transition:background .15s; }
  button:hover { background:#efede7; }
  button.primary { background:var(--red); color:white; border-color:var(--red); }
  button.primary:hover { background:#9d2d2d; }
  .field { position:relative; }
  .field label { display:block; margin-bottom:7px; }
  .field input,.field textarea { display:block; width:100%; padding:11px 13px; font:13px/1.6 var(--mono); }
  .setup button { margin-top:22px; }
  textarea { resize:vertical; min-height:220px; tab-size:2; }
  .notice { min-height:24px; margin:14px 0 0 118px; color:var(--red); font-size:13px; white-space:pre-wrap; }
  footer { border-top:1px solid var(--line); margin-top:24px; padding-top:18px; display:flex; justify-content:space-between; gap:16px; font-size:11px; color:var(--muted); }
  @media(max-width:650px) { main { padding:28px 14px; } header { align-items:start; } h1 { font-size:30px; } .badge { display:none; } .panels { grid-template-columns:minmax(155px,40%) minmax(0,1fr); } .rule-head,.rule-row { grid-template-columns:55px 1fr; } .rule-text,.rule-label,.panel-head span { padding-left:10px; padding-right:10px; } .rule-row,.state-row { font-size:13px; } .stack { min-width:68px; } .state-head { grid-template-columns:1fr 60px; } .state-row { grid-template-columns:minmax(0,1fr) 59px; } .action { padding:0 8px; } .setup { grid-template-columns:76px minmax(0,1fr); gap:14px 10px; } .notice { margin-left:86px; } .help { gap:10px 18px; } footer { flex-direction:column; gap:4px; } }
</style>
</head>
<body>
<main>
  <header><div><h1>shift<span>-red</span></h1></div><div class="badge">Play shift-reduce parsing.</div></header>
  <section class="game" aria-label="Shift-reduce parsing game">
    <div class="panels">
      <section class="rule-panel" aria-label="Grammar rules"><div class="panel-head rule-head"><span>LABEL</span><span>RULE</span></div><div class="scroll" id="rules"></div></section>
      <section style="min-width:0" aria-label="Parsing history"><div class="panel-head state-head"><span>STACK · INPUT</span><span>ACTION</span></div><div class="scroll" id="states"><div class="trace" id="trace"></div></div></section>
    </div>
    <div class="input-area"><div class="input-caption"><label for="user-input">ACTIONS</label><span class="status" id="status" role="status" aria-live="polite"></span></div><input id="user-input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="action-help" placeholder="Type . to shift, or space or a label to reduce" disabled></div>
  </section>
  <section class="setup" aria-label="Game setup">
    <button id="save" type="button">SAVE ↗</button><div class="field"><label for="url">&nbsp;</label><input id="url" readonly placeholder="Save a link to this exact position" spellcheck="false"></div>
    <button id="start" class="primary" type="button">START</button><div class="field"><label for="input">INPUT</label><input id="input" autocomplete="off" spellcheck="false"></div>
    <button id="clear" type="button">CLEAR</button><div class="field"><label for="grammar">LBNF GRAMMAR</label><textarea id="grammar" spellcheck="false" aria-describedby="grammar-help"></textarea></div>
  </section>
  <p class="notice" id="notice" role="status" aria-live="polite"></p>
  <footer><span id="copyright">Design 2026 by Andreas Abel</span><span>BSD 3-clause license</span></footer>
</main>
<script>
"use strict";
const DEFAULT_GRAMMAR = `p. S ::= S "+" F;
m. F ::= F "*" A;
x. A ::= "x";
y. A ::= "y";
z. A ::= "z";
f. S ::= F;
a. F ::= A;
s. A ::= "(" S ")";`;
const DEFAULT_INPUT = 'x+y*(x+y)+z';
const $ = id => document.getElementById(id);
let game = null;

// Scan rather than split on punctuation: quoted dots and semicolons are terminals.
function parseGrammar(source) {
  const tokens = [];
  let i = 0;
  const fail = message => { throw new Error(`Grammar: ${message} (near character ${i + 1}).`); };
  while (i < source.length) {
    if (/\s/.test(source[i])) { i++; continue; }
    if (source.startsWith('--', i) || source.startsWith('//', i)) { while (i < source.length && source[i] !== '\n') i++; continue; }
    if (source.startsWith('/*', i) || source.startsWith('{-', i)) {
      const close = source.startsWith('/*', i) ? '*/' : '-}';
      const end = source.indexOf(close, i + 2);
      if (end < 0) fail('unclosed comment');
      i = end + 2; continue;
    }
    if (source[i] === '"') {
      const start = i++;
      while (i < source.length && source[i] !== '"') { if (source[i] === '\\') i++; i++; }
      if (i >= source.length) fail('unclosed terminal');
      let value;
      try { value = JSON.parse(source.slice(start, ++i)); } catch { fail('invalid quoted terminal'); }
      if (!value) fail('empty terminals are not allowed; use an empty right-hand side');
      tokens.push({kind:'terminal', value}); continue;
    }
    if (source.startsWith('::=', i)) { tokens.push({kind:'::='}); i += 3; continue; }
    if ('.;[]'.includes(source[i])) { tokens.push({kind:source[i++]}); continue; }
    const word = /^[\p{L}_][\p{L}\p{N}_'-]*/u.exec(source.slice(i));
    if (!word) fail(`unexpected ${JSON.stringify(source[i])}`);
    tokens.push({kind:'word', value:word[0]}); i += word[0].length;
  }
  let p = 0;
  function take(kind) { const t = tokens[p++]; if (!t || t.kind !== kind) throw new Error(`Grammar: expected ${kind} near ${tokens[p - 1]?.value || tokens[p - 1]?.kind || 'end of grammar'}.`); return t; }
  function category() { if (tokens[p]?.kind === '[') { p++; const name = '[' + category() + ']'; take(']'); return name; } return take('word').value; }
  const rules = [], labels = new Set();
  let entry = null;
  while (p < tokens.length) {
    if (tokens[p].value === 'entrypoints' && tokens[p + 1]?.kind !== '.') { p++; entry = category(); take(';'); continue; }
    const label = take('word').value; take('.');
    const lhs = category(); take('::=');
    const rhs = [];
    while (tokens[p] && tokens[p].kind !== ';') rhs.push(tokens[p].kind === 'terminal' ? tokens[p++] : {kind:'category', value:category()});
    take(';');
    if (labels.has(label)) throw new Error(`Grammar: duplicate action label “${label}”. Give each production a unique label.`);
    labels.add(label); rules.push({label,lhs,rhs});
  }
  if (!rules.length) throw new Error('Grammar: enter at least one labelled production.');
  const categories = new Set(rules.map(r => r.lhs));
  const builtins = new Set(['Ident','Integer','Double','String','Char']);
  for (const r of rules) for (const symbol of r.rhs) if (symbol.kind === 'category' && !categories.has(symbol.value) && !builtins.has(symbol.value)) throw new Error(`Grammar: category “${symbol.value}” has no production. Use quotes for a terminal. Custom token declarations and LBNF macros must be expanded into labelled productions.`);
  if (entry && !categories.has(entry)) throw new Error(`Grammar: entrypoint “${entry}” has no production.`);
  return {rules, start:entry || rules[0].lhs, categories};
}

function tokenize(input, grammar) {
  const literals = [...new Set(grammar.rules.flatMap(r => r.rhs.filter(s => s.kind === 'terminal').map(s => s.value)))];
  const used = new Set(grammar.rules.flatMap(r => r.rhs.filter(s => s.kind === 'category' && !grammar.categories.has(s.value)).map(s => s.value)));
  const patterns = {Ident:/^[\p{L}_][\p{L}\p{N}_']*/u, Integer:/^\d+/, Double:/^\d+\.\d+(?:[eE][+-]?\d+)?/, String:/^"(?:[^"\\\n]|\\.)*"/, Char:/^'(?:[^'\\\n]|\\.)'/};
  const result = [];
  let i = 0;
  while (i < input.length) {
    if (/\s/.test(input[i])) { i++; continue; }
    let best = null;
    for (const value of literals) if (input.startsWith(value, i) && (!best || value.length > best.text.length)) best = {kind:'terminal', value, text:value};
    for (const name of used) { const match = patterns[name]?.exec(input.slice(i)); if (match && (!best || match[0].length > best.text.length)) best = {kind:'category', value:name, text:match[0]}; }
    // Keep unrecognized input visible; attempting to shift it produces ERROR.
    if (!best) best = {kind:'unknown', value:input[i], text:String.fromCodePoint(input.codePointAt(i))};
    result.push({...best, start:i}); i += best.text.length;
  }
  return result;
}

function canReduce(state, rule) {
  if (state.error || state.stack.length < rule.rhs.length) return false;
  const offset = state.stack.length - rule.rhs.length;
  return rule.rhs.every((symbol,index) => {
    const top = state.stack[offset + index];
    return top.kind === symbol.kind && top.value === symbol.value;
  });
}

function replay(actions, model) {
  const states = [{stack:[], offset:0, position:0}], transitions = [];
  let i = 0;
  while (i < actions.length) {
    const prev = states[states.length - 1];
    let stack = prev.stack.slice(), offset = prev.offset, error = '', action, end;
    if (actions[i] === '.') {
      action = '.'; end = i + 1;
      const token = model.tokens[offset];
      if (!token) error = 'Cannot shift: the input is empty.';
      else if (token.kind === 'unknown') error = `No grammar token matches “${token.text}”.`;
      else { stack.push(token); offset++; }
    } else {
      // The first label completed while scanning left to right wins.
      const rule = model.grammar.rules.filter(r => actions.startsWith(r.label, i)).sort((a,b) => a.label.length - b.label.length)[0];
      if (!rule) { error = `Unknown action at character ${i + 1}: “${actions.slice(i)}”.`; action = '✗'; end = actions.length; }
      else {
        action = rule.label; end = i + rule.label.length;
        if (!canReduce(prev, rule)) error = `Cannot reduce ${rule.label}: the stack must end with ${rule.rhs.map(s => s.value).join(' ') || 'ε'}.`;
        else { stack = stack.slice(0, stack.length - rule.rhs.length); stack.push({kind:'category',value:rule.lhs,text:rule.lhs}); }
      }
    }
    transitions.push({action:error ? '✗' : action, start:i, end, error});
    states.push({stack, offset, position:error ? actions.length : end, error});
    if (error) break;
    i = end;
  }
  return {states, transitions};
}

function element(tag, cls, text) { const el = document.createElement(tag); if (cls) el.className = cls; if (text !== undefined) el.textContent = text; return el; }
function renderRules() {
  $('rules').replaceChildren(...game.grammar.rules.map(rule => {
    const row = element('div','rule-row');
    row.append(element('span','rule-label',rule.label),element('span','rule-text',`${rule.lhs} ← ${rule.rhs.map(s => s.value).join(' ') || 'ε'}`));
    return row;
  }));
}
function render() {
  const current = replay(game.current, game), complete = replay(game.played, game);
  const states = current.states.slice(), transitions = current.transitions.slice();
  const activeIndex = states.length - 1, active = states[activeIndex];
  game.grammar.rules.forEach((rule,index) => {
    $('rules').children[index].className = 'rule-row' + (canReduce(active, rule) ? '' : ' unavailable');
  });
  // Only extend from an actual action boundary. Partial labels remain errors.
  if (!active.error && game.played.startsWith(game.current) && complete.states[activeIndex]?.position === game.current.length) {
    states.push(...complete.states.slice(activeIndex + 1));
    transitions.push(...complete.transitions.slice(activeIndex));
  }
  const fragment = document.createDocumentFragment();
  states.forEach((state,index) => {
    const row = element('div','state-row' + (index === activeIndex ? ' current' : index > activeIndex ? ' future' : ''));
    if (index === activeIndex) row.setAttribute('aria-current','step');
    const content = element('div','state-content');
    content.append(element('span','pointer',index === activeIndex ? '►' : ''));
    if (state.error) { content.append(element('span','error-text','ERROR')); row.title = state.error; }
    else {
      const stack = state.stack.map(s => s.text).join(' ');
      const remaining = state.offset < game.tokens.length ? game.input.slice(game.tokens[state.offset].start) : '';
      content.append(element('span','stack',stack),element('span','dot','·'),element('span','remaining',remaining));
    }
    const transition = transitions[index];
    const action = element('span','action' + (transition?.error ? ' error-text' : ''),transition?.action || '');
    if (transition?.error) action.title = transition.error;
    if (index === activeIndex && index < transitions.length) action.style.opacity = '.35';
    row.append(content,action); fragment.append(row);
  });
  $('trace').replaceChildren(fragment);
  const accepted = !active.error && active.offset === game.tokens.length && active.stack.length === 1 && active.stack[0].kind === 'category' && active.stack[0].value === game.grammar.start;
  $('status').textContent = active.error ? active.error : accepted ? 'Accepted · parse complete' : `${active.offset} / ${game.tokens.length} shifted`;
  $('status').className = 'status' + (accepted ? ' accepted' : '');
  $('user-input').setAttribute('aria-invalid',String(!!active.error));
  // Scroll vertically to the current row without moving the page or horizontal view.
  const row = $('trace').children[activeIndex], box = $('states');
  const top = row.offsetTop - $('trace').offsetTop + 12;
  if (top < box.scrollTop) box.scrollTop = top;
  else if (top + row.offsetHeight > box.scrollTop + box.clientHeight) box.scrollTop = top + row.offsetHeight - box.clientHeight;
}

function start(grammarSource, input, current = '', played = current) {
  try {
    const grammar = parseGrammar(grammarSource);
    game = {source:grammarSource,input,grammar,tokens:tokenize(input,grammar),current,played:played.startsWith(current) ? played : current};
    $('user-input').disabled = false; $('user-input').value = current;
    $('notice').textContent = ''; $('url').value = '';
    renderRules(); render(); return true;
  } catch (error) { $('notice').textContent = error.message; return false; }
}
$('user-input').addEventListener('input', () => {
  const field = $('user-input'), value = field.value;
  let expanded = '', selectionStart = field.selectionStart, selectionEnd = field.selectionEnd;
  for (let i = 0; i < value.length; i++) {
    let replacement = value[i];
    if (replacement === ' ') {
      const state = replay(expanded, game).states.at(-1);
      const rule = game.grammar.rules.find(rule => canReduce(state, rule));
      if (rule) replacement = rule.label;
    }
    expanded += replacement;
    if (i < field.selectionStart) selectionStart += replacement.length - 1;
    if (i < field.selectionEnd) selectionEnd += replacement.length - 1;
  }
  if (expanded !== value) {
    field.value = expanded;
    field.setSelectionRange(selectionStart, selectionEnd);
  }
  game.current = field.value;
  if (!game.played.startsWith(game.current)) game.played = game.current;
  $('url').value = ''; render();
});
$('start').addEventListener('click', () => { if (start($('grammar').value,$('input').value)) $('user-input').focus(); });
$('clear').addEventListener('click', () => { $('input').value = ''; $('grammar').value = ''; $('notice').textContent = 'Setup cleared. Enter a grammar and input, then press START.'; $('grammar').focus(); });
$('save').addEventListener('click', () => {
  if (!game) { $('notice').textContent = 'Start a game before saving a URL.'; return; }
  const url = new URL(location.href);
  url.search = ''; url.hash = '';
  url.searchParams.set('grammar',game.source); url.searchParams.set('input',game.input);
  url.searchParams.set('played',game.played); url.searchParams.set('user-input',game.current);
  $('url').value = url.href; $('url').focus(); $('url').select();
  $('notice').textContent = 'Link selected. Copy it to save or share this game.';
});
$('url').addEventListener('click', () => $('url').select());
// Canonical URL parameters: grammar, input, played, user-input. Accept common aliases.
const params = new URLSearchParams(location.search);
const source = params.get('grammar') ?? params.get('lbnf') ?? DEFAULT_GRAMMAR;
const input = params.get('input') ?? DEFAULT_INPUT;
const actions = params.get('user-input') ?? params.get('userInput') ?? params.get('actions') ?? '';
const played = params.get('played') ?? actions;
$('grammar').value = source; $('input').value = input;
if (start(source,input,actions,played)) {
  const field = $('user-input');
  field.focus();
  field.setSelectionRange(field.value.length, field.value.length);
}
</script>
</body>
</html>
